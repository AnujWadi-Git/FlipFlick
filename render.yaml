services:
  - type: web
    name: flipflick-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: TMDB_API_KEY
        sync: false # set manually in the Render dashboard — never committed
      - key: UPSTASH_REDIS_REST_URL
        sync: false # set manually in the Render dashboard — never committed
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false # set manually in the Render dashboard — never committed
